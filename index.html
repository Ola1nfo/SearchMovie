<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie</title>
    <link rel="icon" href="./img/movie.gif" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="box">
        <header class="container">
            <h2>Введи назву фільм і я покажу потрібну інформацію про нього <img class="arrow" src="./img/arrow.gif" alt=""></h2>
            <div class="row">
                <div class="col-9">
                    <input type="text" class="form-control" aria-label="Text input with radio button" placeholder="Оріганальна назва (англійською)">
                </div>
                <div class="col-3">
                    <button id="search" type="button" class="btn">OK</button>
                </div>
            </div>
        </header>

        <div class="row">
            <div class="col-6">
                <h1 class="h1">Шукані дані:</h1>
                <ul id="filmList">
                
                </ul>
            </div>
            <div class="col-6">
                <h1>Історія переглядів:</h1>
                <ul id="historyList"></ul>
            </div>
        </div>

        <div id="errorModal" class="modal">
            <div class="modal-content">
                <p>Фільм не знайдено!</p>
                <button id="closeModal">Закрити</button>
            </div>
        </div>
    
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="./js/main.js"></script>
</body>
</html>
